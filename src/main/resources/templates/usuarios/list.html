<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/}" class="brand">Restaurante MVC</a>
    <div>
        <a th:href="@{/usuarios}">Usuarios</a>
        <a th:href="@{/pedidos}">Pedidos</a>
    </div>
</nav>
<main class="container">
    <div class="page-header">
        <div>
            <p class="tag">CRUD de usuarios</p>
            <h1>Usuarios registrados</h1>
        </div>
        <a class="btn" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <section class="card table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.name}"></td>
                <td th:text="${usuario.email}"></td>
                <td><span class="badge" th:text="${usuario.role}"></span></td>
                <td th:text="${usuario.status}"></td>
                <td class="actions-cell">
                    <a class="link" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                    <a class="link danger" th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" onclick="return confirm('¿Desea eliminar este usuario?')">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6" class="empty">No hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<footer>Universidad de Cartagena - Actividad académica</footer>
</body>
</html>
